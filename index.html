<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pega Caixa</title>
<style>
  html,body{margin:0;height:100%;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
  /* A área do jogo mantém a proporção de celular (9:16) e cabe em qualquer tela */
  #jogo{position:relative;width:min(100vw,calc(100vh*9/16));aspect-ratio:9/16}
  canvas{width:100%;height:100%;display:block}
  #recomecar{position:absolute;left:50%;top:88%;transform:translateX(-50%);
    font-size:22px;padding:14px 28px;border:0;border-radius:10px;background:#f9a825;display:none}
  /* Caixa onde a pessoa digita o nome (aparece só na primeira tela) */
  #caixaNome{position:absolute;left:10%;width:80%;top:42%;display:flex;flex-direction:column;gap:14px}
  #caixaNome input{font-size:22px;padding:12px;border:3px solid #f9a825;border-radius:10px;text-align:center;background:#fff;color:#000}
  #caixaNome button{font-size:22px;font-weight:bold;padding:12px;border:0;border-radius:10px;background:#f9a825}
</style>
</head>
<body>
<div id="jogo">
  <canvas id="tela" width="360" height="640"></canvas>
  <button id="recomecar">Recomeçar</button>
  <div id="caixaNome">
    <input id="campoNome" maxlength="12" placeholder="Digite seu nome" autocomplete="off">
    <button id="botaoNome">Entrar</button>
  </div>
</div>

const imgsEsferas = fontesEsferas.map(src => { const i = new Image(); i.src = src; return i; });
const ROXA = 3;                           // número da esfera roxa (a que tira vida)

const AMARELA = 2;                        // número da esfera amarela (vale 5 pontos)

// Regras de cada modo. Para ajustar a dificuldade, é só mudar estes números:
//   intervalo   = segundos entre uma bolinha e outra (menor = cai mais bolinha)
//   velocidade  = quanto a bolinha cai rápido
//   chanceRoxa  = chance de a bolinha ser roxa (0.12 = 12%)
const MODOS = {
  facil:   { nome: 'Fácil',   intervalo: 0.7, velocidade: 180, chanceRoxa: 0.12 },
  dificil: { nome: 'Difícil', intervalo: 0.9, velocidade: 320, chanceRoxa: 0.45 },
};

let cena = 'nome';                        // tela atual: 'nome', 'regras', 'modo' ou 'jogo'
let modo = MODOS.facil;                   // modo escolhido
let selecionado = 0;                      // botão marcado na tela de modo (para o teclado)
let jogador = '';                         // nome de quem está jogando
let rank = [];                            // ranking: lista de { nome, pontos, modo }, do maior para o menor
let minhaPosicao = 0;                     // em que lugar do ranking está o jogador
let personagem, esferas, pontos, vidas, tempoNovaCaixa, fim, ultimo;
const teclas = {};                        // guarda quais setas estão apertadas

// ---------- Começa (ou recomeça) o jogo ----------
function iniciar(escolhido) {
  modo = escolhido;
  cena = 'jogo';
  personagem = { x: L/2 - 49/2, y: CHAO - 100, w: 49, h: 100 };
  esferas = [];
  pontos = 0;
  vidas = 3;
  tempoNovaCaixa = 0;
  fim = false;
  arrasto = null;
  botao.style.display = 'none';
  aplicaMusica();                         // começa a música
}

// ---------- Controles ----------
addEventListener('keydown', e => {
  teclas[e.key] = true;
  if (e.repeat) return;                   // ignora tecla segurada
  const confirma = e.key === 'Enter' || e.key === ' ';
  if (cena === 'regras' && confirma) cena = 'modo';
  else if (cena === 'modo') {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') selecionado = 1 - selecionado;
    if (confirma) iniciar(MODOS[BTNS_MODO[selecionado].modo]);
  }
  else if (cena === 'config' && e.key === 'Escape') { cena = 'modo'; aplicaMusica(); }
});
addEventListener('keyup',   e => teclas[e.key] = false);

// Arrastar: o personagem anda junto com o dedo (ou mouse apertado).
// Só tocar na tela NÃO move o personagem; ele só se mexe quando você arrasta.
let arrasto = null;                       // guarda onde o dedo começou e onde o personagem estava
function comecaArrasto(e) { arrasto = { dedoX: e.clientX, persX: personagem.x }; }
function moverPeloDedo(e) {
  if (!arrasto) return;
  const r = tela.getBoundingClientRect();
  const andou = (e.clientX - arrasto.dedoX) / r.width * L;          // quanto o dedo andou
  personagem.x = Math.max(0, Math.min(L - personagem.w, arrasto.persX + andou));
}
// Posição do toque dentro do jogo (360 x 640) e teste "o toque caiu dentro do botão?"
function posicaoNoJogo(e) {
  const r = tela.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * L, y: (e.clientY - r.top) / r.height * A };
}
function dentro(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }

tela.addEventListener('pointerdown', e => {
  if (cena === 'jogo') { comecaArrasto(e); tela.setPointerCapture(e.pointerId); return; }
  const p = posicaoNoJogo(e);
  if (cena === 'regras' && dentro(p, BTN_CONTINUAR)) cena = 'modo';
  else if (cena === 'modo') {
    if (dentro(p, BTN_CONFIG)) { cena = 'config'; aplicaMusica(); return; }
    for (const b of BTNS_MODO) if (dentro(p, b)) iniciar(MODOS[b.modo]);
  }
  else if (cena === 'config') {
    if (dentro(p, BTN_MUSICA)) config.ligada = !config.ligada;                     // liga / desliga
    else if (dentro(p, BTN_MENOS)) config.volume = Math.max(0, config.volume - 10); // volume -
    else if (dentro(p, BTN_MAIS))  config.volume = Math.min(100, config.volume + 10); // volume +
    else if (dentro(p, BTN_VOLTAR)) cena = 'modo';
    guardaConfig(); aplicaMusica();
  }
});
tela.addEventListener('pointermove', e => { if (cena === 'jogo') moverPeloDedo(e); });
tela.addEventListener('pointerup',     () => { arrasto = null; });
tela.addEventListener('pointercancel', () => { arrasto = null; });
// Recomeçar: volta para a escolha do modo (dá para trocar de fácil para difícil)
botao.addEventListener('click', () => { botao.style.display = 'none'; cena = 'modo'; aplicaMusica(); });

// Tira uma vida e termina o jogo se acabaram
function perdeVida() {
  vidas--;
  if (vidas <= 0) { fim = true; botao.style.display = 'block'; salvaRank(); aplicaMusica(); }
}

// ---------- Atualiza o jogo (roda a cada quadro) ----------
function atualizar(dt) {                  // dt = segundos desde o último quadro
  if (cena !== 'jogo' || fim) return;

  // Move o personagem com as setas
  if (teclas.ArrowLeft)  personagem.x -= 300 * dt;
  if (teclas.ArrowRight) personagem.x += 300 * dt;
  personagem.x = Math.max(0, Math.min(L - personagem.w, personagem.x));

  // Cria uma esfera nova de tempos em tempos
  tempoNovaCaixa -= dt;
  if (tempoNovaCaixa <= 0) {
    const t = 36;                         // tamanho da esfera
    // "tipo" é a cor: 0 azul, 1 verde, 2 amarela, 3 roxa
    // Primeiro sorteia se é roxa (chance depende do modo); senão sorteia entre azul, verde e amarela
    const tipo = Math.random() < modo.chanceRoxa ? ROXA : Math.floor(Math.random() * 3);
    esferas.push({ x: Math.random() * (L - t), y: -t, t: t, tipo: tipo });
    tempoNovaCaixa = modo.intervalo;      // tempo até a próxima (depende do modo)
  }

  for (const c of esferas) {
    c.y += modo.velocidade * dt;          // a esfera cai (mais rápido no modo difícil)

    // Encostou no personagem?
    if (c.y + c.t >= personagem.y && c.y <= personagem.y + personagem.h &&
        c.x + c.t >= personagem.x && c.x <= personagem.x + personagem.w) {
      c.pega = true;
      if (c.tipo === ROXA) perdeVida();   // roxa: perde uma vida
      else pontos += (c.tipo === AMARELA ? 5 : 1);   // amarela: +5 pontos; azul e verde: +1
    }
    // Chegou ao chão?
    else if (c.y + c.t >= CHAO) {
      c.pega = true;                      // tira a esfera da lista
      if (c.tipo !== ROXA) perdeVida();   // roxa no chão não custa vida
    }
  }
  esferas = esferas.filter(c => !c.pega);   // remove esferas pegas ou caídas
}

// ---------- Nome e ranking ----------
// O ranking fica guardado no próprio aparelho (navegador). try/catch evita erro se o navegador bloquear isso.
function lerRank() {
  try { return JSON.parse(localStorage.getItem('pegaCaixaRank')) || []; } catch (e) { return []; }
}
function guardaRank() {
  try { localStorage.setItem('pegaCaixaRank', JSON.stringify(rank)); } catch (e) {}
}

// Coloca a pontuação no ranking. Cada pessoa aparece uma vez só, com a melhor pontuação.
function salvaRank() {
  const chave = jogador.toLowerCase();
  const antigo = rank.find(r => r.nome.toLowerCase() === chave);
  if (!antigo) rank.push({ nome: jogador, pontos: pontos, modo: modo.nome });
  else if (pontos > antigo.pontos) { antigo.pontos = pontos; antigo.modo = modo.nome; }
  rank.sort((a, b) => b.pontos - a.pontos);                       // maior pontuação primeiro
  minhaPosicao = rank.findIndex(r => r.nome.toLowerCase() === chave) + 1;
  rank = rank.slice(0, 50);                                       // guarda só os 50 melhores
  guardaRank();
}

// Tela do nome: quando a pessoa confirma, vai para a tela de regras
const caixaNome = document.getElementById('caixaNome');
const campoNome = document.getElementById('campoNome');
function confirmaNome() {
  const nome = campoNome.value.trim().replace(/\s+/g, ' ');
  if (!nome) { campoNome.focus(); return; }                       // sem nome, não segue
  jogador = nome;
  try { localStorage.setItem('pegaCaixaNome', nome); } catch (e) {} // lembra o nome para a próxima vez
  caixaNome.style.display = 'none';
  cena = 'regras';
}
document.getElementById('botaoNome').addEventListener('click', confirmaNome);
campoNome.addEventListener('keydown', e => {
  e.stopPropagation();                                            // não deixa o Enter "pular" a tela de regras
  if (e.key === 'Enter') confirmaNome();
});

function desenhaNome() {
  g.fillStyle = 'rgba(0,0,0,0.65)'; g.fillRect(0, 0, L, A);
  escreve('Pega Caixa', L/2, 110, 38, '#f9a825');
  escreve('Qual é o seu nome?', L/2, 200, 24);
  escreve('Ele vai aparecer no ranking', L/2, 235, 15, '#ccc');
}

// Tela de fim de jogo com o ranking (os 10 primeiros)
function desenhaFim() {
  g.fillStyle = 'rgba(0,0,0,0.78)'; g.fillRect(0, 0, L, A);
  escreve('Fim de jogo', L/2, 65, 36, '#f9a825');
  escreve(jogador + ': ' + pontos + ' pontos', L/2, 103, 20);
  escreve('Ranking', L/2, 148, 24, '#ffd54f');
  rank.slice(0, 10).forEach((r, i) => {
    const y = 186 + i * 27;
    const cor = (i + 1 === minhaPosicao) ? '#ffd54f' : '#fff';    // você aparece em amarelo
    escreve((i + 1) + 'º', 34, y, 18, cor, 'left');
    escreve(r.nome, 76, y, 18, cor, 'left');
    escreve(r.modo, 212, y, 13, '#bbb', 'left');
    escreve(String(r.pontos), L - 34, y, 18, cor, 'right');
  });
  if (minhaPosicao > 10) escreve('Sua posição: ' + minhaPosicao + 'º', L/2, 480, 18, '#ffd54f');
}

// ---------- Música (player oficial do YouTube, escondido) ----------
// Precisa de internet. Se o vídeo não carregar, o jogo continua normalmente, sem música.
const VIDEO_MUSICA = '31QBB0U9BSc';
const config = { ligada: true, volume: 50 };            // volume vai de 0 a 100
try { Object.assign(config, JSON.parse(localStorage.getItem('pegaCaixaConfig')) || {}); } catch (e) {}
function guardaConfig() { try { localStorage.setItem('pegaCaixaConfig', JSON.stringify(config)); } catch (e) {} }

let player = null;
let musica = 'carregando';                              // 'carregando', 'pronta' ou 'erro'
document.getElementById('playerMusica').src = 'https://www.youtube.com/embed/' + VIDEO_MUSICA +
  '?enablejsapi=1&controls=0&loop=1&playlist=' + VIDEO_MUSICA + '&playsinline=1' +
  (location.protocol.indexOf('http') === 0 ? '&origin=' + encodeURIComponent(location.origin) : '');
window.onYouTubeIframeAPIReady = function () {          // o YouTube chama isto quando está pronto
  player = new YT.Player('playerMusica', { events: {
    onReady: () => { musica = 'pronta'; aplicaMusica(); },
    onError: () => { musica = 'erro'; },
    onStateChange: e => { if (e.data === 0) player.playVideo(); }   // 0 = acabou: toca de novo
  }});
};
const roteiroYT = document.createElement('script');
roteiroYT.src = 'https://www.youtube.com/iframe_api';
roteiroYT.onerror = () => { musica = 'erro'; };
document.head.appendChild(roteiroYT);
setTimeout(() => { if (musica === 'carregando') musica = 'erro'; }, 10000);

// Toca ou pausa conforme a tela: toca durante a partida e na tela de configurações (para ouvir o volume)
function aplicaMusica() {
  if (musica !== 'pronta') return;
  try {
    player.setVolume(config.volume);
    const tocar = config.ligada && ((cena === 'jogo' && !fim) || cena === 'config');
    if (tocar) player.playVideo(); else player.pauseVideo();
  } catch (e) {}
}

// ---------- Telas de menu ----------
// Botões: x, y, largura e altura no tamanho do jogo (360 x 640)
const BTN_CONTINUAR = { x: 80, y: 540, w: 200, h: 52, texto: 'Continuar', cor: '#f9a825' };
const BTN_CONFIG = { x: 60,  y: 470, w: 240, h: 48, texto: 'Configurações', cor: '#455a64' };
const BTN_MUSICA = { x: 40,  y: 190, w: 280, h: 56, texto: '', cor: '#2e7d32' };
const BTN_MENOS  = { x: 40,  y: 330, w: 60,  h: 56, texto: '−', cor: '#455a64' };
const BTN_MAIS   = { x: 260, y: 330, w: 60,  h: 56, texto: '+', cor: '#455a64' };
const BTN_VOLTAR = { x: 80,  y: 540, w: 200, h: 52, texto: 'Voltar', cor: '#f9a825' };
const BTNS_MODO = [
  { x: 60, y: 210, w: 240, h: 64, texto: 'Fácil',   cor: '#2e7d32', modo: 'facil',   descricao: 'Mais bolinhas de pontos' },
  { x: 60, y: 350, w: 240, h: 64, texto: 'Difícil', cor: '#c62828', modo: 'dificil', descricao: 'Mais roxas e queda mais rápida' },
];

// Escreve um texto branco com contorno escuro (lê bem sobre o fundo)
function escreve(t, x, y, tam, cor, alinha) {
  g.font = 'bold ' + tam + 'px sans-serif'; g.textAlign = alinha || 'center';
  g.lineJoin = 'round';                   // cantos arredondados no contorno
  g.lineWidth = Math.max(2, Math.min(4, tam / 6)); g.strokeStyle = '#000'; g.strokeText(t, x, y);
  g.fillStyle = cor || '#fff'; g.fillText(t, x, y);
}

function desenhaBotao(b, marcado) {
  g.fillStyle = b.cor; g.fillRect(b.x, b.y, b.w, b.h);
  g.lineWidth = marcado ? 5 : 2; g.strokeStyle = marcado ? '#fff' : 'rgba(255,255,255,0.5)';
  g.strokeRect(b.x, b.y, b.w, b.h);
  escreve(b.texto, b.x + b.w / 2, b.y + b.h / 2 + 9, 26, '#fff');
}

function desenhaRegras() {
  g.fillStyle = 'rgba(0,0,0,0.65)'; g.fillRect(0, 0, L, A);     // escurece o fundo
  escreve('Pega Caixa', L/2, 80, 38, '#f9a825');
  escreve('Pegue as bolinhas que caem!', L/2, 122, 18);

  // Cada linha: bolinha(s) à esquerda e o que acontece à direita
  const linhas = [
    { icones: [AMARELA],  texto: '+5 pontos',    cor: '#ffd54f' },
    { icones: [0, 1],     texto: '+1 ponto',     cor: '#fff' },
    { icones: [ROXA],     texto: 'Perde 1 vida', cor: '#ff8a80' },
  ];
  linhas.forEach((l, i) => {
    const y = 160 + i * 80;
    l.icones.forEach((t, k) => g.drawImage(imgsEsferas[t], 40 + k * 56, y, 56, 56));
    escreve(l.texto, 170, y + 38, 26, l.cor, 'left');
  });

  escreve('Bolinha de pontos que cair no chão', L/2, 425, 16);
  escreve('também faz você perder 1 vida.', L/2, 449, 16);
  escreve('Você começa com 3 vidas.', L/2, 473, 16);
  escreve('Arraste o dedo ou use as setas ← →', L/2, 507, 14, '#ccc');
  desenhaBotao(BTN_CONTINUAR, true);
}

function desenhaConfig() {
  g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillRect(0, 0, L, A);
  escreve('Configurações', L/2, 110, 34, '#f9a825');
  desenhaBotao({ ...BTN_MUSICA, texto: config.ligada ? 'Música: ligada' : 'Música: desligada',
                 cor: config.ligada ? '#2e7d32' : '#b71c1c' }, false);
  escreve('Volume: ' + config.volume + '%', L/2, 305, 22);
  desenhaBotao(BTN_MENOS, false); desenhaBotao(BTN_MAIS, false);
  g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(112, 348, 136, 20);      // barra de volume
  g.fillStyle = '#ffd54f';                g.fillRect(112, 348, 136 * config.volume / 100, 20);
  g.lineWidth = 2; g.strokeStyle = '#fff'; g.strokeRect(112, 348, 136, 20);
  if (musica === 'erro') {
    escreve('Música indisponível agora', L/2, 440, 16, '#ff8a80');
    escreve('(precisa de internet)', L/2, 464, 14, '#ccc');
  } else if (musica === 'carregando') {
    escreve('Carregando a música...', L/2, 440, 16, '#ccc');
  } else {
    escreve('Você ouve a música aqui enquanto ajusta', L/2, 440, 14, '#ccc');
  }
  desenhaBotao(BTN_VOLTAR, true);
}

function desenhaModo() {
  g.fillStyle = 'rgba(0,0,0,0.65)'; g.fillRect(0, 0, L, A);
  escreve('Escolha o modo', L/2, 130, 34, '#f9a825');
  BTNS_MODO.forEach((b, i) => {
    desenhaBotao(b, i === selecionado);
    escreve(b.descricao, L/2, b.y + b.h + 28, 16);
  });
  desenhaBotao(BTN_CONFIG, false);
  escreve('Toque em um modo (ou use ↑ ↓ e Enter)', L/2, 560, 14, '#ccc');
}

// ---------- Desenha tudo ----------
function desenhar() {
  if (fundo.complete && fundo.naturalWidth) g.drawImage(fundo, 0, 0, L, A);  // fundo
  else { g.fillStyle = '#1b1530'; g.fillRect(0, 0, L, A); }                // cor reserva
  if (cena === 'nome')   { desenhaNome();   return; }    // primeira tela: digitar o nome
  if (cena === 'config') { desenhaConfig(); return; }    // volume e música
  if (cena === 'regras') { desenhaRegras(); return; }    // tela inicial com as regras
  if (cena === 'modo')   { desenhaModo();   return; }    // escolha fácil ou difícil
  g.fillStyle = '#78909c'; g.fillRect(0, CHAO, L, 20);   // chão

  // Esferas
  for (const c of esferas) {
    const img = imgsEsferas[c.tipo];
    if (img.complete && img.naturalWidth) g.drawImage(img, c.x, c.y, c.t, c.t);
    else { g.fillStyle = c.tipo === ROXA ? '#8e24aa' : '#29b6f6'; g.beginPath(); g.arc(c.x + c.t/2, c.y + c.t/2, c.t/2, 0, 7); g.fill(); }  // bolinha reserva
  }

  // Personagem (imagem com fundo transparente)
  const m = personagem;
  if (imgPersonagem.complete && imgPersonagem.naturalWidth) g.drawImage(imgPersonagem, m.x, m.y, m.w, m.h);
  else { g.fillStyle = '#c62828'; g.fillRect(m.x, m.y, m.w, m.h); }   // quadrado reserva

  // Pontos e vidas (somem no fim de jogo, que tem tela própria)
  if (!fim) {
  g.font = 'bold 22px sans-serif'; g.lineWidth = 4; g.strokeStyle = '#000'; g.fillStyle = '#fff';
  g.textAlign = 'left';
  g.strokeText('Pontos: ' + pontos, 12, 30); g.fillText('Pontos: ' + pontos, 12, 30);
  g.textAlign = 'right';
  g.strokeText('Vidas: ' + vidas, L - 12, 30); g.fillText('Vidas: ' + vidas, L - 12, 30);
  }

  // Tela de fim de jogo
  if (fim) desenhaFim();
}

// ---------- Repetição principal do jogo ----------
function repetir(agora) {
  const dt = Math.min((agora - ultimo) / 1000, 0.05);  // limite evita saltos
  ultimo = agora;
  atualizar(dt);
  desenhar();
  requestAnimationFrame(repetir);
}

rank = lerRank();                                                 // ranking guardado de outras partidas
try { campoNome.value = localStorage.getItem('pegaCaixaNome') || ''; } catch (e) {}
ultimo = performance.now();
requestAnimationFrame(repetir);
</script>
